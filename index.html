<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>出品台帳</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="出品台帳">
<meta name="theme-color" content="#12203C">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2312203C'/%3E%3Ctext x='90' y='118' font-size='96' font-family='sans-serif' font-weight='700' fill='%23F2EDE3' text-anchor='middle'%3E出%3C/text%3E%3C/svg%3E">
<style>
:root{
  --navy-900:#0E1A31;
  --navy-800:#12203C;
  --navy-700:#1B2A4A;
  --navy-600:#2A3C61;
  --paper:#F2EDE3;
  --paper-dim:#DCD4C4;
  --sumi:#191919;
  --shu:#C43B2F;
  --asagi:#4A8B8C;
  --gold:#C9A227;
  --r:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--navy-900);
  color:var(--paper);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  font-size:16px;line-height:1.5;
  padding-bottom:calc(76px + var(--safe-b));
  -webkit-text-size-adjust:100%;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--navy-800),var(--navy-900));
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 12px;
  border-bottom:1px solid var(--navy-600);
  display:flex;align-items:baseline;gap:12px;
}
header h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.18em}
header .sub{font-size:11px;color:var(--asagi);letter-spacing:.14em}

/* ---------- panels ---------- */
main{padding:18px 16px 8px}
.panel{display:none}
.panel.on{display:block}

.field{margin-bottom:16px}
label{display:block;font-size:11px;letter-spacing:.16em;color:var(--paper-dim);margin-bottom:7px;font-weight:700}
input[type=text],input[type=number],input[type=date],textarea,select{
  width:100%;background:var(--navy-700);border:1px solid var(--navy-600);
  color:var(--paper);border-radius:var(--r);padding:13px 14px;font-size:16px;
  font-family:inherit;
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--asagi);outline-offset:1px;border-color:transparent}
textarea{min-height:64px;resize:vertical}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chips.g5 .chip{min-width:0;padding:13px 2px}
.chip{
  flex:1 1 auto;min-width:74px;text-align:center;
  background:var(--navy-700);border:1px solid var(--navy-600);
  border-radius:var(--r);padding:11px 8px;font-size:14px;cursor:pointer;
  color:var(--paper-dim);
}
.chip[aria-pressed=true]{background:var(--paper);color:var(--sumi);border-color:var(--paper);font-weight:700}

.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}

/* ---------- calc readout ---------- */
.calc{
  background:var(--navy-800);border:1px solid var(--navy-600);
  border-radius:var(--r);padding:14px 16px;margin-bottom:16px;
}
.calc dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:9px 12px}
.calc dt{font-size:12px;color:var(--paper-dim);letter-spacing:.08em}
.calc dd{margin:0;text-align:right;font-size:17px;font-weight:700}
.calc dd.floor{color:var(--shu)}
.calc dd.gain{color:var(--asagi)}

/* ---------- primary button ---------- */
.btn{
  width:100%;border:0;border-radius:var(--r);padding:17px;
  font-size:16px;font-weight:800;letter-spacing:.1em;font-family:inherit;cursor:pointer;
  background:var(--paper);color:var(--sumi);
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--paper-dim);border:1px solid var(--navy-600);font-weight:600}
.btn.danger{background:transparent;color:var(--shu);border:1px solid var(--shu)}
.btn:disabled{opacity:.4}

/* ---------- SIGNATURE: 荷札 ---------- */
.tag{
  position:relative;margin:22px 0 8px;
  background:var(--paper);color:var(--sumi);
  border-radius:4px 4px 4px 4px;
  padding:18px 18px 18px 42px;
  cursor:pointer;display:block;width:100%;text-align:left;border:0;
  font-family:inherit;
  box-shadow:0 10px 26px rgba(0,0,0,.45);
}
.tag::before{ /* 紐穴 */
  content:"";position:absolute;left:16px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;border-radius:50%;
  background:var(--navy-900);box-shadow:inset 0 1px 2px rgba(0,0,0,.6);
}
.tag::after{ /* 切り欠き */
  content:"";position:absolute;left:0;top:0;bottom:0;width:30px;
  border-right:1px dashed rgba(25,25,25,.28);
}
.tag .cap{font-size:10px;letter-spacing:.22em;color:#6B6357;display:block;margin-bottom:5px}
.tag .code{font-size:17px;font-weight:700;letter-spacing:.02em;word-break:break-all;color:var(--shu)}
.tag .hint{display:block;margin-top:8px;font-size:11px;color:#6B6357;letter-spacing:.08em}
.tag.copied .hint{color:var(--asagi);font-weight:700}

/* ---------- list ---------- */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs .chip{min-width:0}
.search{margin-bottom:14px}

.card{
  width:100%;text-align:left;border:0;font-family:inherit;cursor:pointer;
  background:var(--navy-800);border-left:3px solid var(--navy-600);
  border-radius:var(--r);padding:13px 15px;margin-bottom:9px;color:var(--paper);
  display:block;
}
.card.sold{border-left-color:var(--asagi);opacity:.62}
.card.stale{border-left-color:var(--gold)}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .sku{font-size:12px;letter-spacing:.1em;color:var(--paper-dim)}
.card .amt{font-size:15px;font-weight:700}
.card .nm{font-size:15px;margin:4px 0 6px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{font-size:11.5px;color:var(--paper-dim);letter-spacing:.04em}
.card .meta b{color:var(--shu);font-weight:700}

.summary{
  background:var(--navy-800);border-radius:var(--r);padding:13px 15px;margin-bottom:16px;
  display:flex;justify-content:space-between;font-size:13px;
}
.summary b{font-size:16px}

.empty{text-align:center;padding:56px 24px;color:var(--paper-dim)}
.empty p{margin:0 0 6px;font-size:14px}
.empty span{font-size:12.5px;opacity:.7}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,12,24,.72);z-index:40;display:none}
.scrim.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--navy-800);border-radius:18px 18px 0 0;
  padding:20px 18px calc(24px + var(--safe-b));
  max-height:88vh;overflow:auto;transform:translateY(100%);
  transition:transform .22s ease;border-top:1px solid var(--navy-600);
}
.sheet.on{transform:translateY(0)}
.sheet h2{margin:0 0 4px;font-size:17px}
.sheet .sk{font-size:12px;color:var(--paper-dim);letter-spacing:.1em;margin-bottom:16px}
.grip{width:36px;height:4px;border-radius:2px;background:var(--navy-600);margin:0 auto 16px}
.actions{display:flex;flex-direction:column;gap:9px;margin-top:6px}

/* ---------- nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--navy-800);border-top:1px solid var(--navy-600);
  display:flex;padding-bottom:var(--safe-b);
}
nav button{
  flex:1;background:0;border:0;color:var(--paper-dim);font-family:inherit;
  padding:13px 4px 15px;font-size:11px;letter-spacing:.12em;cursor:pointer;font-weight:700;
}
nav button span{display:block;font-size:19px;margin-bottom:2px;font-weight:400}
nav button[aria-selected=true]{color:var(--paper)}
nav button[aria-selected=true] span{color:var(--shu)}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(108px + var(--safe-b));transform:translateX(-50%) translateY(14px);
  background:var(--paper);color:var(--sumi);padding:11px 20px;border-radius:999px;
  font-size:13.5px;font-weight:700;z-index:60;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;white-space:nowrap;max-width:90vw;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

hr.sep{border:0;border-top:1px solid var(--navy-600);margin:22px 0}
.note{font-size:12px;color:var(--paper-dim);line-height:1.7}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>出品台帳</h1>
  <span class="sub" id="hcount"></span>
</header>

<main>

<!-- ============ 登録 ============ -->
<section class="panel on" id="p-add">
  <div class="field">
    <label for="f-name">商品名</label>
    <input type="text" id="f-name" placeholder="せどりすとからタイトルを貼り付け" autocomplete="off">
  </div>

  <div class="field">
    <label>状態</label>
    <div class="chips" id="f-cond"></div>
  </div>

  <div class="field">
    <label>販路</label>
    <div class="chips" id="f-plat"></div>
  </div>

  <div class="field">
    <label>ジャンル</label>
    <div class="chips" id="f-genre"></div>
  </div>

  <div class="row">
    <div class="field">
      <label for="f-cost">仕入値</label>
      <input type="number" id="f-cost" inputmode="numeric" placeholder="0">
    </div>
    <div class="field">
      <label for="f-ship">送料見込み</label>
      <input type="number" id="f-ship" inputmode="numeric">
    </div>
  </div>

  <div class="field">
    <label>棚</label>
    <div class="chips g5" id="f-shelf"></div>
  </div>

  <div class="calc">
    <dl>
      <dt>下限価格（この値まで）</dt><dd class="floor" id="c-floor">—</dd>
      <dt>初値の目安</dt><dd id="c-start">—</dd>
      <dt>下限で売れた時の手残り</dt><dd class="gain" id="c-gain">—</dd>
    </dl>
  </div>

  <div class="field">
    <label for="f-price">出品価格（初値）</label>
    <input type="number" id="f-price" inputmode="numeric">
  </div>

  <div class="field">
    <label for="f-note">メモ</label>
    <input type="text" id="f-note" placeholder="仕入先・気になった点" autocomplete="off">
  </div>

  <button class="btn" id="btn-save">台帳に記入する</button>

  <div id="tag-wrap"></div>
</section>

<!-- ============ 一覧 ============ -->
<section class="panel" id="p-list">
  <div class="tabs" id="l-status"></div>
  <div class="field search">
    <input type="text" id="l-q" placeholder="商品名・管理番号で絞り込む" autocomplete="off">
  </div>
  <div class="summary" id="l-sum"></div>
  <div id="l-body"></div>
</section>

<!-- ============ 設定 ============ -->
<section class="panel" id="p-set">
  <div class="row">
    <div class="field">
      <label for="s-margin">目標利益率 %</label>
      <input type="number" id="s-margin" inputmode="numeric">
    </div>
    <div class="field">
      <label for="s-feeplat">販路ごとの手数料 %</label>
      <select id="s-feeplat" style="margin-bottom:8px"></select>
      <input type="number" id="s-fee" inputmode="numeric">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label for="s-ship">送料の既定値</label>
      <input type="number" id="s-ship" inputmode="numeric">
    </div>
    <div class="field">
      <label for="s-mult">初値の倍率</label>
      <input type="number" id="s-mult" inputmode="decimal" step="0.1">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label for="s-prefix">接頭辞</label>
      <input type="text" id="s-prefix" autocomplete="off">
    </div>
    <div class="field">
      <label for="s-offset">コードのずらし数</label>
      <input type="number" id="s-offset" inputmode="numeric">
    </div>
  </div>
  <p class="note">この数を仕入値に足してからコード化します。0以外にすると同一商品の値動きから原価を推測されなくなります。途中で変えると既に貼ったコードと読み方がずれるので、運用開始前に決めてください。</p>

  <hr class="sep">

  <div class="field">
    <label for="t-genre">説明文のテンプレート（販路ごと）</label>
    <select id="t-genre"></select>
  </div>
  <div class="field">
    <textarea id="t-body" rows="12" style="min-height:280px;font-size:14px;line-height:1.7"></textarea>
    <p class="note" style="margin-top:8px">差し込み記号：<span class="mono">{商品名} {状態} {状態説明} {ジャンル説明} {ハッシュタグ} {管理番号}</span><br>メモ欄は仕入先を書く場所なので、説明文には入りません。</p>
  </div>

  <div class="field">
    <label for="g-genre">ジャンルごとの一文とタグ</label>
    <select id="g-genre"></select>
  </div>
  <div class="field">
    <textarea id="g-body" rows="3" style="font-size:14px;line-height:1.7"></textarea>
  </div>
  <div class="field">
    <input type="text" id="g-tag" placeholder="#タグ #タグ" autocomplete="off">
  </div>

  <div class="field">
    <label for="c-cond">状態ごとの説明文</label>
    <select id="c-cond"></select>
  </div>
  <div class="field">
    <textarea id="c-body" rows="5" style="font-size:14px;line-height:1.7"></textarea>
  </div>
  <button class="btn ghost" id="t-reset">テンプレートを初期状態に戻す</button>

  <hr class="sep">

  <div class="field">
    <label>コードの読み方</label>
    <div class="calc mono" style="text-align:center;font-size:15px;letter-spacing:.2em" id="s-table"></div>
  </div>
  <div class="field">
    <label for="s-dec">コードを解読する</label>
    <input type="text" id="s-dec" placeholder="ENTT" autocomplete="off" style="text-transform:uppercase">
    <p class="note" id="s-dec-out" style="margin-top:8px"></p>
  </div>

  <hr class="sep">

  <div class="actions">
    <button class="btn ghost" id="s-export">CSVを書き出す</button>
    <button class="btn ghost" id="s-backup">バックアップを書き出す</button>
    <button class="btn ghost" id="s-restore">バックアップから復元する</button>
    <button class="btn danger" id="s-wipe">台帳をすべて消す</button>
  </div>
  <input type="file" id="s-file" accept=".json,application/json" hidden>
  <p class="note" style="margin-top:16px">書き出したCSVはPC側の <span class="mono">inv.py import</span> にそのまま読み込めます。</p>
</section>

</main>

<nav id="nav">
  <button data-p="p-add" aria-selected="true"><span>✎</span>登録</button>
  <button data-p="p-list" aria-selected="false"><span>▤</span>一覧</button>
  <button data-p="p-set" aria-selected="false"><span>⚙</span>設定</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="sheet-body"></div></div>
<div id="toast"></div>

<script>
"use strict";

/* ---------------- 既定テンプレート ---------------- */
var PLATS=["メルカリ","メルカリShops","ヤフオク"];
var GENRES=["フィギュア","ゲーム","アケパーツ","共通"];
var CONDS_D=["新品未開封","未使用に近い","開封品","中古"];
var DEF_FEE={"メルカリ":10,"メルカリShops":10,"ヤフオク":10};

var DEF_TPL={
"メルカリ":"{商品名}\n\n■状態\n{状態}\n{状態説明}\n{ジャンル説明}\n\n■発送について\n・緩衝材を使用し、丁寧に梱包してお送りします。\n・平日は当日〜翌日発送を心がけております。\n\n■注意事項\n※お写真に写っているものが全てです。\n※完璧な美品をお求めの方、神経質な方はご購入をお控えください。\n\n{ハッシュタグ}\n\n{管理番号}",

"メルカリShops":"{商品名}\n\n■商品について\n秋葉原で古物商許可を受けた事業者が出品しております（東京都公安委員会 第305511207538号）。\n\n■状態\n{状態}\n{状態説明}\n{ジャンル説明}\n\n■発送について\n・緩衝材を使用し、丁寧に梱包して発送いたします。\n・平日は当日〜翌日発送を心がけております。\n\n■注意事項\n※お写真に写っているものが全てです。\n※初期不良を除き、返品はお受けいたしかねます。\n\n{ハッシュタグ}\n\n{管理番号}",

"ヤフオク":"{商品名}\n\n■商品について\n秋葉原で古物商許可を受けた事業者が出品しております（東京都公安委員会 第305511207538号）。\n\n■状態\n{状態}\n{状態説明}\n{ジャンル説明}\n\n■発送について\n・落札後24時間以内にご連絡いたします。\n・緩衝材を使用し、丁寧に梱包して発送いたします。\n・複数落札の場合は同梱可能です。落札後にご相談ください。\n\n■お取引について\n・落札後3日以内にご連絡、5日以内にご入金をお願いいたします。\n・中古品につき、細かな傷や汚れを見落とす場合があります。\n・商品説明と著しく異なる場合を除き、返品はお受けいたしかねます。\n\n{管理番号}"
};

var DEF_GENRE={
"フィギュア":"※付属パーツはお写真にてご確認ください。細かな部品は紛失しやすいため、開封・組立時はご注意ください。",
"ゲーム":"※ディスク・カートリッジや説明書に使用感がある場合があります。",
"アケパーツ":"※三和電子・セイミツ工業の正規取扱ルートより入手した純正品です。",
"共通":""
};

var DEF_TAG={
"フィギュア":"#フィギュア #アニメグッズ",
"ゲーム":"#ゲームソフト #レトロゲーム",
"アケパーツ":"#アーケード #三和電子 #セイミツ工業 #アケコン",
"共通":""
};

var DEF_COND={
"新品未開封":"未開封の新品です。長期保管品の場合、外箱に多少のスレ・小キズ・日焼けがあることがあります。お写真にてご確認ください。\n※未開封のため内容物の検品は行っておりません。",
"未使用に近い":"開封済みですが、ほぼ未使用の状態です。目立つ傷や汚れはございません。",
"開封品":"開封品です。同梱物は揃っております。外箱に多少のスレ・小キズがある場合があります。お写真にてご確認ください。",
"中古":"中古品です。使用に伴う傷や汚れがある場合があります。お写真にてご確認ください。"
};

/* ---------------- storage ---------------- */
var KEY="fucho_ledger_v1";
var mem=null;
function load(){
  if(mem)return mem;
  var d={items:[],cfg:{margin:20,fee:10,ship:700,mult:1.6,prefix:"OT",offset:0,shelf:"A",cond:"新品未開封",
    genre:"フィギュア",plat:"メルカリ",tplVer:2,fees:{},templates:{},genreText:{},tagText:{},condText:{}}};
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var p=JSON.parse(raw);d.items=p.items||[];for(var k in p.cfg||{})d.cfg[k]=p.cfg[k];}
  }catch(e){}
  if(d.cfg.tplVer!==2){ d.cfg.templates={}; d.cfg.tplVer=2; }
  if(!d.cfg.templates)d.cfg.templates={};
  if(!d.cfg.genreText)d.cfg.genreText={};
  if(!d.cfg.tagText)d.cfg.tagText={};
  if(!d.cfg.condText)d.cfg.condText={};
  if(!d.cfg.fees)d.cfg.fees={};
  PLATS.forEach(function(x){
    if(!d.cfg.templates[x])d.cfg.templates[x]=DEF_TPL[x];
    if(d.cfg.fees[x]==null)d.cfg.fees[x]=DEF_FEE[x];
  });
  GENRES.forEach(function(g){
    if(d.cfg.genreText[g]==null)d.cfg.genreText[g]=DEF_GENRE[g];
    if(d.cfg.tagText[g]==null)d.cfg.tagText[g]=DEF_TAG[g];
  });
  CONDS_D.forEach(function(c){if(!d.cfg.condText[c])d.cfg.condText[c]=DEF_COND[c];});
  if(!d.cfg.genre)d.cfg.genre="フィギュア";
  if(!d.cfg.plat)d.cfg.plat="メルカリ";
  mem=d;return d;
}

  catch(e){toast("保存できません。ブラウザの設定を確認してください");}

/* ---------------- 符丁 ---------------- */
var FUCHO="TOCEANSHIFT";
function enc(v){
  var n=Math.round(v)+load().cfg.offset;
  if(n<0)n=0;
  var s=String(n);while(s.length<4)s="0"+s;
  var o="";for(var i=0;i<s.length;i++)o+=FUCHO.charAt(+s.charAt(i));
  return o;
}
function dec(code){
  code=(code||"").trim().toUpperCase();
  if(!code)return null;
  var s="";
  for(var i=0;i<code.length;i++){
    var x=FUCHO.indexOf(code.charAt(i));
    if(x<0)return null;
    s+=x;
  }
  return parseInt(s,10)-load().cfg.offset;
}

/* ---------------- 計算 ---------------- */
function feeOf(plat){
  var c=load().cfg;
  var v=c.fees&&c.fees[plat];
  return (v==null?c.fee:v);
}
function floorPrice(cost,ship,plat){
  var c=load().cfg;
  var denom=(100-feeOf(plat)-c.margin)/100;
  if(denom<=0)return 0;
  return Math.ceil((cost+ship)/denom/100)*100;
}
function netAt(price,cost,ship,plat){
  return Math.round(price-price*feeOf(plat)/100-ship-cost);
}
function yen(n){return (n<0?"-":"")+"¥"+Math.abs(Math.round(n)).toLocaleString("ja-JP");}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function ymd6(iso){return iso.replace(/-/g,"").slice(2);}

function nextSku(shelf){
  var c=load().cfg,max=0;
  var rx=new RegExp("^"+c.prefix+"-"+shelf+"(\\d+)$");
  load().items.forEach(function(it){var m=rx.exec(it.sku);if(m)max=Math.max(max,+m[1]);});
  return c.prefix+"-"+shelf+String(max+1).padStart(3,"0");
}
function buildDesc(it){
  var c=load().cfg;
  var pl=it.platform||"メルカリ";
  var tpl=(c.templates&&c.templates[pl])||DEF_TPL[pl]||DEF_TPL["メルカリ"];
  var ct=(c.condText&&c.condText[it.cond])||DEF_COND[it.cond]||"";
  var gt=(c.genreText&&c.genreText[it.genre])||"";
  var tg=(c.tagText&&c.tagText[it.genre])||"";
  return tpl.replace(/\{商品名\}/g,it.name)
            .replace(/\{状態\}/g,it.cond||"")
            .replace(/\{状態説明\}/g,ct)
            .replace(/\{ジャンル説明\}/g,gt)
            .replace(/\{ハッシュタグ\}/g,tg)
            .replace(/\{管理番号\}/g,codeLine(it))
            .replace(/\n{3,}/g,"\n\n").trim();
}
function codeLine(it){
  return "※管理番号："+it.sku+"-"+ymd6(it.listDate)+"-"+enc(it.cost)+"-"+enc(it.floor);
}

/* ---------------- ui helpers ---------------- */
function $(id){return document.getElementById(id);}
var toastT;
function toast(m){
  var t=$("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("on");},1900);
}
function copy(text,cb){
  var done=function(){if(cb)cb();};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,function(){legacy();});
  }else legacy();
  function legacy(){
    var ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");done();}catch(e){toast("コピーできませんでした");}
    document.body.removeChild(ta);
  }
}
function chipset(host,vals,cur,onPick){
  host.innerHTML="";

    b.type="button";b.className="chip";b.textContent=v;
    b.setAttribute("aria-pressed",v===cur?"true":"false");

  });

var CONDS=CONDS_D;
var SHELVES=["A","B","C","D","E"];
var draft={cond:null,shelf:null,genre:null,plat:null};

function renderAdd(){
  var c=load().cfg;
  if(!draft.cond)draft.cond=c.cond;
  if(!draft.shelf)draft.shelf=c.shelf;
  if(!draft.genre)draft.genre=c.genre;
  if(!draft.plat)draft.plat=c.plat;
  chipset($("f-plat"),PLATS,draft.plat,function(v){draft.plat=v;renderAdd();});
  chipset($("f-cond"),CONDS,draft.cond,function(v){draft.cond=v;renderAdd();});
  chipset($("f-genre"),GENRES,draft.genre,function(v){draft.genre=v;renderAdd();});
  chipset($("f-shelf"),SHELVES,draft.shelf,function(v){draft.shelf=v;renderAdd();});
  if($("f-ship").value==="")$("f-ship").value=c.ship;
  recalc();
}
function recalc(){
  var cost=+$("f-cost").value||0;
  var ship=+$("f-ship").value;
  if($("f-ship").value==="")ship=load().cfg.ship;
  if(!cost){$("c-floor").textContent="—";$("c-start").textContent="—";$("c-gain").textContent="—";return;}
  var f=floorPrice(cost,ship,draft.plat);
  var start=Math.ceil(f*load().cfg.mult/100)*100;
  $("c-floor").textContent=yen(f);
  $("c-start").textContent=yen(start);
  $("c-gain").textContent=yen(netAt(f,cost,ship,draft.plat));
  if(!$("f-price").dataset.touched)$("f-price").value=start;
}

var lfilter="出品中";
function renderList(){
  chipset($("l-status"),["出品中","売却済","すべて"],lfilter,function(v){lfilter=v;renderList();});
  var q=$("l-q").value.trim().toLowerCase();
  var rows=load().items.filter(function(it){
    if(lfilter!=="すべて"&&it.status!==lfilter)return false;
    if(q&&(it.name+" "+it.sku).toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return a.sku<b.sku?1:-1;});

  var live=load().items.filter(function(i){return i.status==="出品中";});
  var stock=live.reduce(function(s,i){return s+i.cost;},0);
  var profit=load().items.filter(function(i){return i.status==="売却済";})
    .reduce(function(s,i){return s+netAt(i.soldPrice,i.cost,i.ship||0,i.platform);},0);
  $("l-sum").innerHTML="<div>在庫原価 <b>"+yen(stock)+"</b></div><div>累計手残り <b>"+yen(profit)+"</b></div>";

  var body=$("l-body");body.innerHTML="";

    body.innerHTML='<div class="empty"><p>ここには何もありません</p><span>登録タブから1件目を記入してください</span></div>';
    return;
  }
  var now=Date.now();
  rows.forEach(function(it){
    var stale=it.status==="出品中"&&(now-new Date(it.listDate).getTime())>90*864e5;
    var b=document.createElement("button");
    b.type="button";
    b.className="card"+(it.status==="売却済"?" sold":stale?" stale":"");
    var meta=it.status==="売却済"
      ? (it.platform||"メルカリ")+" ／ "+it.soldDate+" ／ 売価 "+yen(it.soldPrice)+" ／ 手残り "+yen(netAt(it.soldPrice,it.cost,it.ship||0,it.platform))
      : (it.platform||"メルカリ")+" ／ 原価 "+yen(it.cost)+" ／ 下限 <b>"+yen(it.floor)+"</b>"+(stale?" ／ 90日超":"");
    b.innerHTML='<div class="top"><span class="sku mono"></span><span class="amt"></span></div>'+
                '<div class="nm"></div><div class="meta">'+meta+'</div>';
    b.querySelector(".sku").textContent=it.sku;
    b.querySelector(".amt").textContent=yen(it.status==="売却済"?it.soldPrice:it.price);
    b.querySelector(".nm").textContent=it.name;
    b.onclick=function(){openSheet(it.sku);};

  });

     '<button class="btn ghost" id="sh-copy">管理番号をコピーする</button>';

    h+='<button class="btn ghost" id="sh-price">出品価格を書き換える</button>'+

  }

    save();closeSheet();renderList();refreshCount();toast("削除しました");
  };
  $("scrim").classList.add("on");
  requestAnimationFrame(function(){$("sheet").classList.add("on");});
